# Mac 2 (Avneet, 10.7.19.93) — main nginx edge — /opt/homebrew/etc/nginx/nginx.conf
# Collected 2026-11-23 23:01 IST (read-only). nginx/1.31.6. Private key path only; key contents never read.
worker_processes 1;

events {
    worker_connections 1024;
}

http {

    include mime.types;
    default_type application/octet-stream;
    proxy_cache_path /opt/homebrew/var/nginx/cache
                 levels=1:2
                 keys_zone=api_cache:10m
                 max_size=100m
                 inactive=60s
                 use_temp_path=off;
    upstream backend_servers {
        server 10.7.31.224:3001 max_fails=1 fail_timeout=5s;
        server 10.7.31.224:3002 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 8080;
        server_name app.team1.test;

        return 301 https://app.team1.test:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name app.team1.test;

        ssl_certificate     /Users/avneet/cn-project/tls/app.team1.test.pem;
        ssl_certificate_key /Users/avneet/cn-project/tls/app.team1.test-key.pem;

        location / {
	proxy_cache api_cache;
proxy_cache_valid 200 60s;

add_header X-Cache-Status $upstream_cache_status;

proxy_cache_revalidate on;
            proxy_pass http://backend_servers;
	proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
