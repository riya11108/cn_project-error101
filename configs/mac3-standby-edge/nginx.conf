# Mac 3 (Riya, 10.7.31.224) — standby nginx edge — ~/cn-project/standby-nginx/nginx.conf
# Started with: nginx -p /Users/riyayadav/cn-project/standby-nginx/ -c nginx.conf
# Collected 2026-11-23 23:01 IST (read-only). Private key path only; key contents never read.
worker_processes  1;

pid logs/nginx.pid;
error_log logs/error.log;

events {
    worker_connections 1024;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log logs/access.log;

    upstream backend_servers {
        server 127.0.0.1:3001 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:3002 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 8443 ssl;
        server_name app.team1.test;

        ssl_certificate /Users/riyayadav/cn-project/tls/app.team1.test.pem;
        ssl_certificate_key /Users/riyayadav/cn-project/tls/app.team1.test-key.pem;

        location / {
            proxy_pass http://backend_servers;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
